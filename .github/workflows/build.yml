a
name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o ElectedBrideApp_Starter.zip -d extracted
          ls -la extracted/ElectedBrideApp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build AAB
        working-directory: extracted/ElectedBrideApp
        run: gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ElectedBrideApp-AAB
          path: extracted/ElectedBrideApp/app/build/outputs/bundle/release/*.aab
